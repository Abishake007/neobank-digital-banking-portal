<div class="container py-5 mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 p-4" style="border-radius: 20px;">
        
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock-fill text-success fs-1"></i>
          <h3 class="fw-bold mt-2">Authorize Top-up</h3>
          <p class="text-muted">Enter UPI details and your NeoBank password</p>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small">Amount (₹)</label>
          <input type="number" [(ngModel)]="topupAmount" class="form-control" placeholder="0.00">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small">UPI ID (VPA)</label>
          <input type="text" [(ngModel)]="userVpa" class="form-control" placeholder="username@upi">
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold small">Confirm NeoBank Password</label>
          <input type="password" [(ngModel)]="password" class="form-control" placeholder="••••••••">
          <small class="text-muted">Required to authorize the digital transfer.</small>
        </div>

        <button (click)="onAddFunds()" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
          Securely Add Funds
        </button>

        <div class="text-center mt-3">
          <a routerLink="/dashboard" class="text-decoration-none text-muted small">Cancel and Return</a>
        </div>
      </div>
    </div>
  </div>
</div>
