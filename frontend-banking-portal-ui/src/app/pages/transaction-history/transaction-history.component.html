<div class="page-content container">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white fw-bold">
      <i class="bi bi-clock-history me-2"></i> Transaction History
    </div>

    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Date</th>
          <th>Category</th> <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let tx of transactions">
          <td>{{ tx.createdAt | date:'short' }}</td>
          <td>
            <span class="badge rounded-pill bg-info text-dark">
              {{ tx.category || 'OTHERS' }}
            </span>
          </td>
          <td class="fw-bold">₹ {{ tx.amount }}</td>
          <td>
            <span class="badge" [ngClass]="tx.status === 'SUCCESS' ? 'bg-success' : 'bg-danger'">
              {{ tx.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
